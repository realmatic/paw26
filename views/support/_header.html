{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>realmatic</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{% static '/realmatic/favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static '/realmatic/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static '/realmatic/favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static '/realmatic/favicon/site.webmanifest' %}">
    <link rel="mask-icon" href="{% static '/realmatic/favicon/safari-pinned-tab.svg' %}" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Josefin+Sans&family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    {% include 'support/_include.html' %}
    <link href="{% static '/support/style.css' %}" rel="stylesheet" />
</head>
<body>
  <!--Main Navigation-->
  <header>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white py-0">
      <div class="container-fluid ps-5 pe-5">
        <a class="navbar-brand" href="/">
          <img src="{% static '/realmatic/media/shi-logo.png' %}"  alt="" width='40px'>
	  <!--- span class='brand'>realmatic</span --->
	</a>


          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
          </button>

        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav ms-auto">
	        {% if user.is_authenticated %}
              <li class="nav-item">
	            <a class="nav-link" aria-current="page" href="/domain">{{ user.username|default:'Guest' }}</a>
              </li>
              <li class="nav-item">
	            <form id='logout-form' method='post' action="{% url 'logout' %}">
                  {% csrf_token %}
                  <button type='submit' class='btn btn-link'><i class="fa-solid fa-sign-out fa-lg" title='Logout'></i></button>
                </form>
              </li>
	        {% else %}
              <li class="nav-item">
		        <a class="nav-link" aria-current="page" href="{% url 'login' %}"><i class="fa-solid fa-user-lock fa-lg" title='Login'></i></a>
              </li>
	        {% endif %}
          </ul>
        </div>
      </div>
    </nav>
    <!-- Navbar -->
  </header>
