{% extends 'support/layout.html' %}

{% load static %}

{% block content %}

<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-1 pb-2 mb-2 me-4">

<h3>Are you sure you want to delete "{{ record.title }}"?</h3>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>
<a href="{% url 'record_list' %}">Cancel</a>

{% endblock %}
